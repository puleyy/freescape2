<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>3D Planner — FREESPACE BUILDING</title>

  <style>

    :root {
      --ac: #1273EA;
      --ink: #17365F;
      --mu: #4A6C99;
      --sel: #DCEBFF;
      --bd: #BFDDFF;
      --g1: linear-gradient(135deg, #1273EA 0%, #2F8CFF 50%, #5CB0FF 100%);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: #F2F8FF;
      -webkit-user-select: none;
      user-select: none;
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      border: 0;
      background: none;
      padding: 0;
    }

    svg.i {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    #vp {
      position: fixed;
      inset: 0;
      background-color: #F2F8FF;
      background-image:
        linear-gradient(rgba(18, 115, 234, .09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 115, 234, .09) 1px, transparent 1px),
        linear-gradient(rgba(18, 115, 234, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 115, 234, .045) 1px, transparent 1px),
        linear-gradient(170deg, #FFFFFF 0%, #EAF4FF 28%, #CDE5FF 62%, #A6D2FF 100%);
      background-size: 60px 60px, 60px 60px, 12px 12px, 12px 12px, 100% 100%;
    }

    #vp canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: 0;
    }

    .card {
      background: #fff;
      border: 1px solid var(--bd);
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(8, 48, 110, .13);
    }

    #top {
      position: fixed;
      left: 12px;
      top: 12px;
      display: flex;
      gap: 12px;
      z-index: 6;
      padding-top: env(safe-area-inset-top, 0);
    }

    #top .b {
      height: 60px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      font-size: 19px;
      font-weight: 500;
      white-space: nowrap;
      position: relative;
    }

    #top .sq {
      width: 60px;
      padding: 0;
      justify-content: center;
    }

    #top .grp {
      display: flex;
      padding: 0;
    }

    #top .grp button {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
    }

    #top .home {
      background: var(--g1);
      width: 60px;
      padding: 0;
      justify-content: center;
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(47, 140, 255, .35);
    }

    #top .dis {
      opacity: .4;
      pointer-events: none;
    }

    .dot {
      position: absolute;
      right: 8px;
      top: 8px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ac);
    }

    .menu {
      position: absolute;
      left: 0;
      top: 68px;
      min-width: 200px;
      padding: 6px;
      display: none;
      z-index: 9;
    }

    .menu.on {
      display: block;
    }

    .menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      font-size: 16px;
      border-radius: 5px;
    }

    .menu button:hover,
    .menu button.on {
      background: var(--sel);
      color: var(--ac);
    }

    #rail {
      position: fixed;
      left: 12px;
      top: 205px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 6;
    }

    .rg {
      display: flex;
      flex-direction: column;
      padding: 0;
    }

    .rg button {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      border-radius: 10px;
    }

    .rg button.on {
      background: var(--sel);
      color: var(--ac);
    }

    #cats {
      position: fixed;
      left: 84px;
      top: 345px;
      z-index: 6;
      display: none;
      flex-direction: column;
      padding: 0;
    }

    #cats.on {
      display: flex;
    }

    #cats button {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      border-radius: 10px;
    }

    #cats button.on {
      background: var(--sel);
      color: var(--ac);
    }

    #panel {
      position: fixed;
      left: 158px;
      top: 178px;
      bottom: 92px;
      width: min(740px, calc(100vw - 176px));
      z-index: 7;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #panel.on {
      display: flex;
    }

    #panel.xl {
      left: 12px;
      width: calc(100vw - 24px);
      top: 90px;
    }

    #ph {
      background: var(--g1);
      color: #fff;
      height: 54px;
      flex: none;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 10px;
    }

    #ph h2 {
      margin: 0;
      font-size: 22px;
      flex: 1;
    }

    #ph button {
      color: #fff;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
    }

    #pb {
      flex: 1;
      overflow: auto;
      padding: 18px 22px;
    }

    #cr {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 19px;
      margin-bottom: 18px;
      position: relative;
    }

    #cr .lk {
      color: var(--ac);
      cursor: pointer;
    }

    #cr .sp {
      flex: 1;
    }

    .fb {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--bd);
      color: var(--ac);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 17px;
      background: #fff;
    }

    .fb svg {
      width: 22px;
      height: 22px;
    }

    .vt {
      width: 50px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 3px;
      color: #444;
    }

    .vt.on {
      background: var(--sel);
      color: var(--ac);
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 26px 22px;
    }

    #grid.list {
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .it {
      position: relative;
      cursor: pointer;
    }

    .it .im {
      position: relative;
      aspect-ratio: 1;
      background: #EAF4FF;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid var(--bd);
    }

    .it img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .it .pc,
    .it .hr {
      position: absolute;
      top: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(23, 54, 95, .62);
      color: #fff;
      display: grid;
      place-items: center;
    }

    .it .pc {
      left: 8px;
    }

    .it .hr {
      right: 8px;
      background: rgba(255, 255, 255, .85);
      color: #555;
    }

    .it .hr.on {
      color: #e0245e;
    }

    .it .pc svg,
    .it .hr svg {
      width: 16px;
      height: 16px;
    }

    .it .br {
      font-size: 15px;
      color: var(--mu);
      margin-top: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .it .nm {
      font-size: 19px;
      font-weight: 500;
    }

    #grid.list .it {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    #grid.list .im {
      width: 84px;
      flex: none;
    }

    #grid.list .br {
      margin: 0;
    }

    .sw {
      aspect-ratio: 1;
      border-radius: 3px;
      border: 1px solid #ddd;
      position: relative;
    }

    .it .sn {
      margin-top: 8px;
      font-size: 16px;
    }

    .sl {
      display: grid;
      grid-template-columns: 110px 1fr 70px;
      gap: 12px;
      align-items: center;
      margin: 14px 0;
      font-size: 17px;
    }

    .sl input {
      width: 100%;
      accent-color: var(--ac);
    }

    .sl b {
      text-align: right;
    }

    .gt {
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 26px 18px;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      background: #F2F8FF;
    }

    .gt:hover {
      background: var(--sel);
    }

    .gt small {
      display: block;
      color: var(--mu);
      font-weight: 400;
      font-size: 15px;
      margin-top: 6px;
    }

    #q {
      display: none;
      margin: -6px 0 16px;
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      font: inherit;
      font-size: 17px;
      -webkit-user-select: text;
      user-select: text;
    }

    #q.on {
      display: block;
    }

    #bar {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 8;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    #bar .card {
      display: flex;
      padding: 6px 6px;
      gap: 4px;
    }

    #bar button {
      width: 62px;
      height: 60px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      font-size: 29px;
      font-weight: 300;
    }

    #bar button.on {
      background: var(--sel);
      color: var(--ac);
    }

    #bar button.fc {
      outline: 2px solid var(--ac);
      outline-offset: -3px;
    }

    #set {
      position: fixed;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      padding: 16px 20px;
      z-index: 8;
      display: none;
      width: 300px;
      font-size: 16px;
    }

    #set.on {
      display: block;
    }

    #set label {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 0;
    }

    #pop {
      position: fixed;
      z-index: 5;
      display: none;
      padding: 0;
      transform: translate(-50%, -100%);
      margin-top: -12px;
    }

    #pop.on {
      display: flex;
    }

    #pop:after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -8px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-right: 1px solid var(--bd);
      border-bottom: 1px solid var(--bd);
      transform: translateX(-50%) rotate(45deg);
      box-shadow: 2px 2px 3px rgba(0, 0, 0, .1);
    }

    #pop button {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
    }

    #pop svg {
      width: 28px;
      height: 28px;
    }

    #pop .g {
      width: 34px;
      cursor: grab;
      color: #555;
    }

    .dm {
      position: fixed;
      z-index: 4;
      background: var(--ac);
      color: #fff;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 14px;
      font-weight: 600;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      white-space: nowrap;
    }

    .dm.g {
      background: #0E9F6E;
    }

    #toast {
      position: fixed;
      left: 50%;
      top: 84px;
      transform: translateX(-50%);
      background: #17365F;
      color: #fff;
      padding: 10px 18px;
      border-radius: 6px;
      z-index: 20;
      opacity: 0;
      transition: .3s;
      pointer-events: none;
    }

    #toast.on {
      opacity: 1;
    }

    @media (max-width: 760px) {
      #top .b {
        padding: 0 12px;
        font-size: 16px;
        height: 52px;
      }

      #top .b span.t {
        display: none;
      }

      #top .grp button,
      #top .sq,
      #top .home {
        width: 48px;
        height: 52px;
      }

      #rail {
        top: 150px;
      }

      #rail button,
      #cats button {
        width: 50px;
        height: 50px;
      }

      #cats {
        left: 70px;
        top: 290px;
      }

      #panel {
        left: 12px;
        width: calc(100vw - 24px);
        top: 80px;
        bottom: 84px;
      }

      #bar button {
        width: 50px;
        height: 52px;
      }
    }
  </style>
</head>

<body>
  <div id="vp"></div>
  <div id="top"></div>
  <div id="rail"></div>
  <div id="cats" class="card"></div>
  <div id="panel" class="card"></div>
  <div id="pop" class="card"></div>
  <div id="bar"></div>
  <div id="set" class="card"></div>
  <div id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (() => {
      const T = THREE;
      const $ = s => document.querySelector(s);
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const fm = n => String(Math.round(n * 10) / 10).replace('.', ',');

      const lc = c => new T.Color(c).convertSRGBToLinear();
      const dk = (c, t = .18) => '#' + new T.Color(c).multiplyScalar(1 - t).getHexString();

      const mat = (c, o) => new T.MeshStandardMaterial(
        Object.assign({ color: lc(c), roughness: .65, metalness: 0 }, o)
      );

      const B = (g, w, h, d, c, x, y, z, o) => {
        const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat(c, o));
        m.position.set(x, y + h / 2, z);
        m.castShadow = m.receiveShadow = true;
        g.add(m);
        return m;
      };

      const C = (g, r, h, c, x, y, z, o, rt) => {
        const m = new T.Mesh(new T.CylinderGeometry(rt == null ? r : rt, r, h, 24), mat(c, o));
        m.position.set(x, y + h / 2, z);
        m.castShadow = true;
        g.add(m);
        return m;
      };

      const S0 = (g, r, c, x, y, z, o) => {
        const m = new T.Mesh(new T.SphereGeometry(r, 20, 14), mat(c, o));
        m.position.set(x, y, z);
        m.castShadow = true;
        g.add(m);
        return m;
      };

      const MT = { metalness: .85, roughness: .28 };
      const GL = { transparent: true, opacity: .35, roughness: .05, metalness: .3 };

      const I = {
        home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="m9.5 15 2.5-2.5 2.5 2.5"/>',
        menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
        layers: '<path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/>',
        save: '<path d="M5 3h12l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/>',
        undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
        redo: '<path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/>',
        help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01"/>',
        room: '<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M11 3v8H3M11 11h10M15 11v10"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-5-5"/>',
        chair: '<path d="M6 11V8a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v3"/><path d="M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v5H3z"/><path d="M6 18v2M18 18v2"/>',
        heart: '<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
        text: '<path d="M4 4h12v6M4 4v14h8"/><path d="M7 8h6M10 8v6"/><path d="m13 21 1-4 7-7 3 3-7 7z" transform="translate(-3 -1) scale(.9)"/>',
        tape: '<circle cx="10" cy="12" r="7"/><circle cx="10" cy="12" r="3"/><path d="M17 12h5v6H11"/>',
        cam: '<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/>',
        stairs: '<path d="M3 20h5v-5h5v-5h5V5h3"/>',
        win: '<rect x="4" y="3" width="16" height="18"/><path d="M4 9h16M4 15h16M12 3v18"/>',
        lamp: '<path d="m8 4 8 3-3 7-7-3z"/><path d="m13 14-1 7M9 21h6"/>',
        surf: '<rect x="3" y="3" width="18" height="18"/><path d="M3 9 9 3M3 15 15 3M3 21 21 3M9 21 21 9M15 21l6-6"/>',
        tap: '<path d="M4 9h9a4 4 0 0 1 4 4v1M4 9V6h4M17 14v3M14 21h6M17 17v4"/>',
        ppl: '<circle cx="9" cy="6" r="3"/><path d="M3 20v-3a5 5 0 0 1 8-3.5"/><path d="m15 15 3-2 3 2v4l-3 2-3-2z"/>',
        walk: '<circle cx="13" cy="4" r="2"/><path d="m10 21 2-7-3-3 3-3 3 3 3 1M9 11l-3 3M12 14l3 7"/>',
        zo: '<circle cx="10" cy="10" r="7"/><path d="m21 21-6-6M7 10h6"/>',
        zi: '<circle cx="10" cy="10" r="7"/><path d="m21 21-6-6M7 10h6M10 7v6"/>',
        set: '<path d="M3 7h10M17 7h4M3 17h4M11 17h10"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
        pen: '<path d="m4 20 1-5L16 4l4 4L9 19z"/><path d="m14 6 4 4"/>',
        pip: '<path d="m4 20 1-4 9-9 4 4-9 9z"/><path d="m14 6 3-3a2.5 2.5 0 0 1 4 4l-3 3"/>',
        grip: '<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
        trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
        exp: '<path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/>',
        x: '<path d="M5 5l14 14M19 5 5 19"/>',
        back: '<path d="M20 12H4M10 6l-6 6 6 6"/>',
        filt: '<path d="M3 5h18l-7 8v6l-4 2v-8z"/>',
        grid: '<rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/>',
        list: '<path d="M4 6h16M4 12h16M4 18h16"/>',
        dn: '<path d="m6 9 6 6 6-6"/>'
      };

      const ic = n => `<svg class="i" viewBox="0 0 24 24">${I[n]}</svg>`;

      const rnd = () => {
        let s = 7;
        return () => (s = s * 16807 % 2147483647) / 2147483647;
      };

      function ftex(kind, base, rx, ry) {
        const r = rnd();
        const c = document.createElement('canvas');
        c.width = c.height = 256;
        const x = c.getContext('2d');
        const col = new T.Color(base);
        const sh = t => '#' + col.clone().multiplyScalar(1 - t).getHexString();
        const lt = t => '#' + col.clone().lerp(new T.Color('#fff'), t).getHexString();

        x.fillStyle = base;
        x.fillRect(0, 0, 256, 256);

        if (kind == 'plank') {
          for (let y = 0, q = 0; y < 256; y += 32, q++) {
            const o = (q * 97) % 256;
            for (let xx = -o; xx < 256; xx += 160) {
              x.fillStyle = r() < .5 ? sh(.08 * r()) : lt(.08 * r());
              x.fillRect(xx, y, 160, 32);
              x.fillStyle = sh(.28);
              x.fillRect(xx, y, 2, 32);
            }
            x.fillStyle = sh(.34);
            x.fillRect(0, y, 256, 2);
          }
          for (let i = 0; i < 320; i++) {
            x.fillStyle = 'rgba(60,35,15,' + (.05 + r() * .08) + ')';
            x.fillRect(r() * 256, r() * 256, 20 + r() * 80, 1);
          }
        } else if (kind == 'tile') {
          for (let y = 0; y < 256; y += 128) {
            for (let xx = 0; xx < 256; xx += 128) {
              x.fillStyle = r() < .5 ? lt(.04 * r()) : sh(.04 * r());
              x.fillRect(xx, y, 128, 128);
              x.strokeStyle = sh(.22);
              x.lineWidth = 3;
              x.strokeRect(xx, y, 128, 128);
            }
          }
        } else {
          for (let i = 0; i < 1400; i++) {
            x.fillStyle = 'rgba(' + (r() < .5 ? '0,0,0,' : '255,255,255,') + r() * .07 + ')';
            x.fillRect(r() * 256, r() * 256, 2 + r() * 5, 2 + r() * 5);
          }
        }

        const t = new T.CanvasTexture(c);
        t.wrapS = t.wrapT = T.RepeatWrapping;
        t.repeat.set(rx, ry);
        t.encoding = T.sRGBEncoding;
        t.anisotropy = 8;
        return t;
      }

      const FLOORS = [
        ['Oak', 'plank', '#CDAA78'],
        ['Walnut', 'plank', '#7A5133'],

        desk: (c, w, d, lg, dr) => {
          const g = new T.Group();
          const h = .74;
          B(g, w, .04, d, c, 0, h - .04, 0);
          if (lg == 'tube') {
            [-1, 1].forEach(a => [-1, 1].forEach(b =>

            ));
          } else {

            );
          }
          if (dr) B(g, .42, .52, d - .08, dk(c, .12), w / 2 - .3, .14, 0);
          return g;
        },

        chair: (c, k) => {
          const g = new T.Group();

        shelf: (c, w, h, n) => {

          for (let i = 0; i <= n; i++) B(g, w, .03, .32, c, 0, i * (h - .03) / n, 0);
          B(g, w - .06, h, .01, dk(c, .2), 0, 0, -.15);
          return g;

        sofa: (c, w) => {
          const g = new T.Group();

          B(g, w, .5, .2, dk(c, .1), 0, .45, -.35);
          [-1, 1].forEach(a => B(g, .2, .3, .9, dk(c, .1), a * (w / 2 - .1), .4, 0));
          [-1, 1].forEach(a => [-1, 1].forEach(b =>
            C(g, .03, .14, '#2b2b2b', a * (w / 2 - .1), 0, b * .38)

          [-1, 1].forEach(a => B(g, w / 2 - .25, .22, .16, '#F1ECE4', a * w * .25, .54, -.12));

        },

        bed: (c, w) => {

          B(g, w, .3, 2, dk(c, .15), 0, .08, 0);
          B(g, w - .08, .2, 1.94, '#F3F0EA', 0, .38, .02);
          B(g, w, .95, .08, c, 0, .08, -1.02);
          [-1, 1].forEach(a => B(g, w / 2 - .12, .14, .42, '#fff', a * w * .25, .58, -.66));
          B(g, w - .08, .05, .9, dk(c, .05), 0, .58, .5);
          return g;
        },

        wardrobe: (c, w, h) => {
          const g = new T.Group();
          B(g, w, h, .58, c, 0, 0, 0);
          const n = Math.round(w / .55);
          for (let i = 1; i < n; i++) {
            B(g, .01, h - .1, .01, dk(c, .35), -w / 2 + i * w / n, .05, .295);
          }
          for (let i = 0; i < n; i++) {
            B(g, .02, .3, .02, '#C9CED3', -w / 2 + (i + .5) * w / n + .12, h * .45, .3, MT);
          }
          return g;
        },

        table: (c, w, d, rd) => {
          const g = new T.Group();
          if (rd) {
            C(g, w / 2, .04, c, 0, .7, 0);
            C(g, .05, .7, dk(c), 0, 0, 0);
            C(g, .3, .03, dk(c), 0, 0, 0);
          } else {
            B(g, w, .04, d, c, 0, .7, 0);
            [-1, 1].forEach(a => [-1, 1].forEach(b =>

            ));
          }
          return g;
        },

        coffee: (c, w, d) => {
          const g = new T.Group();
          B(g, w, .04, d, c, 0, .36, 0);
          [-1, 1].forEach(a => [-1, 1].forEach(b =>

        tv: (c, w) => {
          const g = new T.Group();
          B(g, w, .42, .4, c, 0, .1, 0);
          [-1, 1].forEach(a => C(g, .025, .1, '#222', a * (w / 2 - .08), 0, 0));
          B(g, w * .7, .62, .04, '#0d0f12', 0, .9, 0, { roughness: .2, metalness: .4 });
          B(g, .3, .28, .05, dk(c, .2), 0, .52, -.02);

        rug: (c, w, d, rd) => {

        plant: (c, k) => {
          const g = new T.Group();
          C(g, .2 * k, .34 * k, '#B9B2A6', 0, 0, 0, {}, .16 * k);
          S0(g, .36 * k, c, 0, .8 * k, 0);
          S0(g, .25 * k, dk(c, -.1), .18 * k, 1.1 * k, .05 * k);
          S0(g, .22 * k, dk(c, .2), -.18 * k, 1.0 * k, -.05 * k);

        kitchen: (c, w, top) => {
          const g = new T.Group();
          B(g, w, .74, .6, c, 0, .1, 0);
          B(g, w + .02, .04, .62, top, 0, .84, 0);
          B(g, w - .02, .1, .5, '#222', 0, 0, -.02);
          const n = Math.max(1, Math.round(w / .6));
          for (let i = 1; i < n; i++) {
            B(g, .012, .7, .01, dk(c, .45), -w / 2 + i * w / n, .12, .305);

        fridge: (c) => {
          const g = new T.Group();
          B(g, .7, 1.8, .65, c, 0, 0, 0, MT);
          B(g, .01, .01, .6, '#333', 0, 1.1, .33);
          B(g, .02, .5, .03, '#444', -.26, 1.2, .34);
          B(g, .02, .5, .03, '#444', -.26, .5, .34);

        lamp: (c, k) => {
          const g = new T.Group();
          if (k == 'floor') {
            C(g, .16, .03, '#2b2b2b', 0, 0, 0);
            C(g, .012, 1.45, '#2b2b2b', 0, 0, 0);
            C(g, .2, .3, c, 0, 1.35, 0, { emissive: lc(c), emissiveIntensity: .35, side: 2 }, .12);
          } else if (k == 'table') {
            C(g, .1, .03, '#2b2b2b', 0, 0, 0);
            C(g, .012, .3, '#2b2b2b', 0, 0, 0);
            C(g, .14, .2, c, 0, .3, 0, { emissive: lc(c), emissiveIntensity: .35, side: 2 }, .08);
          } else {
            C(g, .008, k, '#222', 0, 1.7, 0);
            C(g, .24, .2, c, 0, 1.5, 0, { emissive: lc(c), emissiveIntensity: .5, side: 2 }, .06);

        toilet: (c) => {

        sink: (c) => {

        shower: (c) => {
          const g = new T.Group();
          B(g, .9, .07, .9, c, 0, 0, 0);

        bath: (c) => {

        door: (c) => {
          const g = new T.Group();
          B(g, .9, 2.05, .05, c, 0, 0, 0);
          [-1, 1].forEach(a => B(g, .06, 2.1, .1, dk(c, .3), a * .47, 0, 0));
          B(g, .94, .06, .1, dk(c, .3), 0, 2.05, 0);
          B(g, .04, .12, .06, '#C9CED3', .32, .95, .05, MT);
          return g;

        win: (c, w, h) => {
          const g = new T.Group();
          B(g, w, h, .03, '#cfe4ee', 0, .9, 0, GL);
          [[0, h + .9, w, .06], [0, .9, w, .06]].forEach(a =>
            B(g, a[2], a[3], .1, c, 0, a[1] - (a[1] > 1 ? .06 : 0), 0)
          );
          [-1, 1].forEach(a => B(g, .06, h + .06, .1, c, a * w / 2, .9, 0));
          B(g, .04, h, .06, c, 0, .9, 0);
          B(g, w + .2, .04, .2, c, 0, .86, .06);
          return g;

        spiral: (c) => {
          const g = new T.Group();
          C(g, .07, 2.7, '#8F959B', 0, 0, 0, MT);
          const N = 13;

          for (let i = 0; i < N; i++) {
            const t = new T.Mesh(
              new T.CylinderGeometry(.9, .9, .05, 3, 1, false, 0, Math.PI / 5.5),
              mat(c)
            );
            t.geometry.translate(0, 0, 0);
            t.position.y = .2 * (i + 1) - .03;
            t.rotation.y = i * Math.PI / 6.2;
            t.castShadow = true;
            g.add(t);

            C(g, .012, .9, '#9aa0a6',
              Math.sin(i * Math.PI / 6.2 + Math.PI / 11) * .86,
              .2 * (i + 1),
              Math.cos(i * Math.PI / 6.2 + Math.PI / 11) * .86,
              MT);
          }

          const pts = [];
          for (let i = 0; i <= 60; i++) {
            const a = i / 60 * (N) * Math.PI / 6.2 + Math.PI / 11;
            pts.push(new T.Vector3(
              Math.sin(a) * .86,
              .2 + i / 60 * N * .2 + .9,
              Math.cos(a) * .86
            ));
          }
          const tb = new T.Mesh(
            new T.TubeGeometry(new T.CatmullRomCurve3(pts), 90, .03, 8),
            mat('#4a3426')
          );
          tb.castShadow = true;
          g.add(tb);
          return g;
        },

        stair: (c, w) => {

          for (let i = 0; i < 14; i++) {
            B(g, w, .04, .27, c, 0, .19 * i + .15, -.27 * i + 1.7);

          [-1, 1].forEach(a => {
            const m = B(g, .05, .3, 4.1, '#3a3d42', a * w / 2, 0, 0);
            m.rotation.x = -Math.atan(.19 / .27);
            m.position.set(a * w / 2, 1.35, 0);
          });
          return g;
        },

        person: (c) => {

          S0(g, .11, '#F0F1F4', 0, 1.7, 0, m);
          return g;
        }

      Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 9, bottom: -9, far: 40 });
      sc.add(sun);

      const fill = new T.DirectionalLight(0xdfe8ff, .25);
      fill.position.set(6, 4, -4);
      sc.add(fill);

      let room = null;
      let az = .12, el = .62, dist = 9, dT = 9;
      let tgt = new T.Vector3(0, .9, 0);
      let walk = { x: 0, z: 1.5, yaw: 0, pit: 0 };
      let keys = {};

      const ray = new T.Raycaster();
      const nd = new T.Vector2();
      const pl = new T.Plane(new T.Vector3(0, 1, 0), 0);

      function roomBuild() {
        if (room) {
          sc.remove(room);
          room.traverse(o => {
            if (o.geometry) o.geometry.dispose();
            if (o.material && o.material.map) o.material.map.dispose();
          });
        }

        room = new T.Group();
        const { W, D, H } = S;
        const f = FLOORS[S.floor];

        const fl = new T.Mesh(
          new T.BoxGeometry(W + .2, .12, D + .2),
          mat('#fff', { roughness: .45, map: ftex(f[1], f[2], W / 1.6, D / 1.6) })
        );
        fl.position.set(0, -.06, 0);
        fl.receiveShadow = true;
        fl.userData.floor = 1;
        room.add(fl);

        const wm = k => mat(S.walls[k], {
          transparent: true,
          opacity: mode == 'walk' ? 1 : (S.opaque ? .95 : .5),
          roughness: .9,
          depthWrite: false,
          side: T.DoubleSide
        });

        const wl = (k, w, h, d, x, z) => {
          const m = new T.Mesh(new T.BoxGeometry(w, h, d), wm(k));
          m.position.set(x, h / 2, z);
          m.userData.wall = k;
          m.renderOrder = 2;
          room.add(m);

          const cap = new T.Mesh(
            new T.BoxGeometry(w + (d < .2 ? .0 : 0), .06, d + .02),
            mat('#fff')
          );
          cap.position.set(x, h + .03, z);
          cap.castShadow = true;
          room.add(cap);
        };

        wl('back', W + .2, H, .1, 0, -D / 2 - .05);
        wl('left', .1, H, D, -W / 2 - .05, 0);
        wl('right', .1, H, D, W / 2 + .05, 0);

        [[-W / 2 - .1, -D / 2 - .1], [W / 2 + .1, -D / 2 - .1]].forEach(a => {
          const p = new T.Mesh(new T.BoxGeometry(.14, H + .06, .14), mat('#fff'));
          p.position.set(a[0], (H + .06) / 2, a[1]);
          room.add(p);
        });

        const sk = new T.Mesh(new T.BoxGeometry(W, .06, .02), mat('#fff'));
        sk.position.set(0, .03, -D / 2 + .01);
        room.add(sk);

        if (selWall) {
          const sp = {
            back: [W, H, 0, H / 2, -D / 2 + .01, 0],
            left: [D, H, -W / 2 + .01, H / 2, 0, Math.PI / 2],
            right: [D, H, W / 2 - .01, H / 2, 0, -Math.PI / 2]
          }[selWall];

          const hm = new T.Mesh(
            new T.PlaneGeometry(sp[0], sp[1]),
            new T.MeshBasicMaterial({
              color: lc('#2F8CFF'),
              transparent: true,
              opacity: .4,
              depthWrite: false,
              side: T.DoubleSide
            })
          );
          hm.position.set(sp[2], sp[3], sp[4]);
          hm.rotation.y = sp[5];
          hm.renderOrder = 3;
          room.add(hm);

          const ln = new T.LineSegments(
            new T.EdgesGeometry(hm.geometry),
            new T.LineBasicMaterial({ color: lc('#1273EA'), depthTest: false })
          );
          ln.position.copy(hm.position);
          ln.rotation.copy(hm.rotation);
          ln.renderOrder = 4;
          room.add(ln);
        }

        const dm = dimsBuild();
        room.userData.dim = dm;
        room.add(dm);
        dimVis();

        sc.add(room);
        sun.target.position.set(0, 0, 0);
        sc.add(sun.target);
      }

      const hs = new T.Group();
      const gz = new T.Group();
      sc.add(hs);
      let bh = null;

      (() => {
        const m = c => new T.MeshBasicMaterial({ color: lc(c), depthTest: false, toneMapped: false });
        const d = new T.Mesh(new T.CylinderGeometry(.34, .34, .02, 36), m('#fff'));
        d.renderOrder = 20;
        gz.add(d);

        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(a => {
          const c = new T.Mesh(new T.ConeGeometry(.07, .16, 3), m('#1273EA'));
          c.position.set(a[0] * .2, .02, a[1] * .2);
          c.rotation.set(
            a[1] ? (a[1] > 0 ? Math.PI / 2 : -Math.PI / 2) : 0,
            0,
            a[0] ? (a[0] > 0 ? -Math.PI / 2 : Math.PI / 2) : 0
          );
          c.renderOrder = 21;
          gz.add(c);

        gz.userData.grab = 1;
        gz.visible = false;
        sc.add(gz);
      })();

      const DC = '#1273EA';
      const V = (x, y, z) => new T.Vector3(x, y, z);
      const bm = c => new T.MeshBasicMaterial({ color: lc(c), toneMapped: false });

      function lbl(t, k, col) {
        const c = document.createElement('canvas');
        c.width = 384;
        c.height = 96;
        const x = c.getContext('2d');
        const r = 40;

        x.fillStyle = col || 'rgba(18,115,234,.95)';
        x.beginPath();
        x.moveTo(r, 6);
        x.lineTo(384 - r, 6);
        x.arc(384 - r, 48, 42, -Math.PI / 2, Math.PI / 2);
        x.lineTo(r, 90);
        x.arc(r, 48, 42, Math.PI / 2, 3 * Math.PI / 2);
        x.closePath();
        x.fill();

        x.fillStyle = '#fff';
        x.font = 'bold 44px "Segoe UI",system-ui,sans-serif';
        x.textAlign = 'center';
        x.textBaseline = 'middle';
        x.fillText(t, 192, 50);

        const tx = new T.CanvasTexture(c);
        tx.encoding = T.sRGBEncoding;

        const sp = new T.Sprite(new T.SpriteMaterial({
          map: tx,
          transparent: true,
          depthTest: false,
          toneMapped: false
        }));
        sp.scale.set(5 * k, 1.25 * k, 1);
        sp.renderOrder = 10;
        return sp;
      }

      function seg(g, a, b, rad) {
        const v = b.clone().sub(a);
        const L = v.length();
        const m = new T.Mesh(new T.CylinderGeometry(rad, rad, L, 8), bm(DC));
        m.position.copy(a).addScaledVector(v, .5);
        m.quaternion.setFromUnitVectors(V(0, 1, 0), v.normalize());
        g.add(m);
      }

      function dline(g, a, b, off, text, k, fr) {
        const n = off.clone().normalize();
        const A = a.clone().add(off);
        const Bp = b.clone().add(off);
        const u = Bp.clone().sub(A).normalize();
        const s = .12 * k;

        seg(g, a.clone().addScaledVector(n, .08 * k), A.clone().addScaledVector(n, .22 * k), s * .25);
        seg(g, b.clone().addScaledVector(n, .08 * k), Bp.clone().addScaledVector(n, .22 * k), s * .25);
        seg(g, A, Bp, s * .4);

        [[A, u.clone().negate()], [Bp, u]].forEach(q => {
          const c = new T.Mesh(new T.ConeGeometry(s * .9, s * 2.6, 12), bm(DC));
          c.position.copy(q[0]).addScaledVector(q[1], -s * 1.3);
          c.quaternion.setFromUnitVectors(V(0, 1, 0), q[1]);
          g.add(c);
        });

        const l = lbl(text, k);
        l.position.copy(A).lerp(Bp, fr).addScaledVector(n, .9 * k);
        l.position.y += .3 * k;
        g.add(l);
        l.userData.A = A.clone();
        l.userData.B = Bp.clone();
        return l;
      }

      function handle(g, p, dir, k, id) {
        const h = new T.Group();
        h.position.set(p.x, p.y + .04, p.z);
        h.userData.hid = id;
        g.add(h);

        const mt = c => new T.MeshBasicMaterial({ color: lc(c), toneMapped: false, depthTest: false });
        const add = (m, ro) => {
          m.renderOrder = ro;
          h.add(m);
          return m;
        };

        add(new T.Mesh(new T.CylinderGeometry(.5 * k, .5 * k, .03, 32), mt('#ffffff')), 11);

        const rg = add(new T.Mesh(new T.TorusGeometry(.5 * k, .04 * k, 8, 32), mt(DC)), 12);
        rg.rotation.x = Math.PI / 2;

        [1, -1].forEach(sg => {
          const d = dir.clone().multiplyScalar(sg);
          const c = add(new T.Mesh(new T.ConeGeometry(.2 * k, .46 * k, 3), mt(DC)), 12);
          c.position.copy(d).multiplyScalar(.31 * k);
          c.position.y = .03;
          c.quaternion.setFromUnitVectors(V(0, 1, 0), d);
        });

        h.add(new T.Mesh(
          new T.SphereGeometry(.95 * k, 8, 6),
          new T.MeshBasicMaterial({ visible: false })
        ));
      }

      function dimsBuild() {
        const { W, D, H } = S;
        const k = .33;
        const gp = .62;
        const q = new T.Group();
        const x0 = -W / 2, x1 = W / 2, z0 = -D / 2, z1 = D / 2;

        const l1 = dline(q, V(x0, 0, z1), V(x1, 0, z1), V(0, 0, gp), 'Lebar ' + fm(W) + ' m', k, .2);
        const l2 = dline(q, V(x1, 0, z0), V(x1, 0, z1), V(gp, 0, 0), 'Panjang ' + fm(D) + ' m', k, .75);
        dline(q, V(x0, 0, z1), V(x0, H, z1), V(-gp * .8, 0, gp * .8), 'Tinggi ' + fm(H) + ' m', k, .5);

        const lu = lbl('Luas ' + fm(W * D) + ' m\u00b2', k, 'rgba(14,159,110,.95)');
        lu.position.copy(l1.position);
        lu.position.y += 1.3 * k;
        q.add(lu);

        handle(q, l1.userData.B, V(1, 0, 0), k * 1.7, 'w');
        handle(q, l2.userData.A, V(0, 0, 1), k * 1.7, 'd');
        return q;
      }

      function dimVis() {
        if (room && room.userData.dim) room.userData.dim.visible = meas && mode != 'walk';
      }

      function hitDim(e) {
        if (!room || !room.userData.dim || !room.userData.dim.visible) return null;

        const hl = [];
        room.userData.dim.traverse(o => {
          if (o.userData && o.userData.hid) hl.push(o);
        });

        const r = cast(e).intersectObjects(hl, true)[0];
        if (!r) return null;

        let o = r.object;
        while (o && !o.userData.hid) o = o.parent;
        return o;
      }

      function mkObj(rec) {
        const d = CAT[rec.id];
        const g = build(d, rec.c);

        if (d.gen == 'lamp' && typeof d.a[0] == 'number') {
          g.clear();
          const k = S.H - 1.7;
          g.add(...G.lamp(rec.c, k).children);
        }

        g.userData.rec = rec;
        apply(g);
        sc.add(g);
        objs.push(g);
        return g;
      }

      function apply(o) {
        const r = o.userData.rec;
        const d = CAT[r.id];

        o.rotation.y = r.r * Math.PI / 180;
        o.position.set(r.x, 0, r.z);

        if (!d.wall) {
          const b = new T.Box3().setFromObject(o);
          const hx = (b.max.x - b.min.x) / 2;
          const hz = (b.max.z - b.min.z) / 2;
          r.x = clamp(r.x, -S.W / 2 + hx, S.W / 2 - hx);
          r.z = clamp(r.z, -S.D / 2 + hz, S.D / 2 - hz);
          o.position.set(r.x, 0, r.z);
        }
      }

      function refit(o) {
        const r = o.userData.rec;
        const d = CAT[r.id];

        if (d.wall) {
          if (r.r == 0) {
            r.z = -S.D / 2 + .05;
            r.x = clamp(r.x, -S.W / 2 + .6, S.W / 2 - .6);
          } else if (r.r == 90) {
            r.x = -S.W / 2 + .05;
            r.z = clamp(r.z, -S.D / 2 + .6, S.D / 2 - .6);
          } else {
            r.x = S.W / 2 - .05;
            r.z = clamp(r.z, -S.D / 2 + .6, S.D / 2 - .6);
          }
        }
        apply(o);
      }

      function moveTo(o, x, z) {
        const r = o.userData.rec;
        const d = CAT[r.id];

        if (d.wall) {
          const k = [
            ['b', Math.abs(z + S.D / 2)],
            ['l', Math.abs(x + S.W / 2)],
            ['r', Math.abs(x - S.W / 2)]
          ].sort((a, b) => a[1] - b[1])[0][0];

          if (k == 'b') {
            r.r = 0;
            r.z = -S.D / 2 + .05;
            r.x = clamp(x, -S.W / 2 + .6, S.W / 2 - .6);
          } else if (k == 'l') {
            r.r = 90;
            r.x = -S.W / 2 + .05;
            r.z = clamp(z, -S.D / 2 + .6, S.D / 2 - .6);
          } else {
            r.r = 270;
            r.x = S.W / 2 - .05;
            r.z = clamp(z, -S.D / 2 + .6, S.D / 2 - .6);
          }
        } else {
          r.x = x;
          r.z = z;
        }
        apply(o);
      }

      function showFloor() {
        objs.forEach(o => {
          sc.remove(o);
          o.traverse(m => {
            if (m.geometry) m.geometry.dispose();
          });

      $('#top').innerHTML = `

      const RG = [

      const thumbs = {};
      let tr, ts, tc;

      function thumb(d, c) {
        const k = d.id + c;
        if (thumbs[k]) return thumbs[k];

        if (!tr) {
          tr = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
          tr.setSize(240, 240);
          tr.outputEncoding = T.sRGBEncoding;
          tr.toneMapping = T.ACESFilmicToneMapping;
          tr.shadowMap.enabled = true;
          tr.setClearColor(0xEAF4FF, 1);

          ts = new T.Scene();
          ts.add(new T.HemisphereLight(0xffffff, 0xaaaaaa, 1));

          const l = new T.DirectionalLight(0xffffff, 1);
          l.position.set(3, 6, 4);
          l.castShadow = true;
          l.shadow.camera.left = l.shadow.camera.bottom = -4;
          l.shadow.camera.right = l.shadow.camera.top = 4;
          ts.add(l);

          tc = new T.PerspectiveCamera(30, 1, .1, 60);

          const g = new T.Mesh(
            new T.PlaneGeometry(40, 40),
            new T.ShadowMaterial({ opacity: .22 })
          );
          g.rotation.x = -Math.PI / 2;
          g.receiveShadow = true;
          ts.add(g);
        }

        const g = G[d.gen](c, ...d.a);
        if (d.gen == 'lamp' && typeof d.a[0] == 'number') {
          g.clear();
          g.add(...G.lamp(c, 1).children);
        }
        ts.add(g);

        const b = new T.Box3().setFromObject(g);
        const ct = b.getCenter(new T.Vector3());
        const r = b.getSize(new T.Vector3()).length();
        tc.position.set(ct.x + r * 1.05, ct.y + r * .85, ct.z + r * 1.45);
        tc.lookAt(ct);
        tr.render(ts, tc);

        const u = tr.domElement.toDataURL('image/jpeg', .88);
        ts.remove(g);
        g.traverse(m => {
          if (m.geometry) m.geometry.dispose();
        });
        return thumbs[k] = u;
      }

      const GROUPS = t => {

        if (T0 == 'room') {

        } else if (T0 == 'surf') {
          const floorSw = FLOORS.map((f, i) => {
            const bg = f[1] == 'plank'
              ? `repeating-linear-gradient(0deg,${f[2]} 0 14px,${dk(f[2], .25)} 14px 16px)`
              : f[1] == 'tile'
                ? `linear-gradient(${dk(f[2], .3)} 2px,transparent 2px) 0 0/50% 50%,linear-gradient(90deg,${dk(f[2], .3)} 2px,transparent 2px) 0 0/50% 50%,${f[2]}`
                : f[2];
            return `
              <div class="it" data-f="${i}">

          const wallSw = WALLS.map((w, i) => `

            </div>`).join('');

          body = `
            <div style="font-size:19px;margin-bottom:14px">Floor</div>
            <div id="grid">${floorSw}</div>
            <div style="font-size:19px;margin:24px 0 14px">Walls ${selWall
              ? `<small style="color:#4A6C99">(selected: ${selWall})</small>`
              : '<small style="color:#4A6C99">(all walls)</small>'}</div>
            <div id="grid">${wallSw}</div>`;
        } else if (T0 == 'search' || T0 == 'fav') {
          const L = T0 == 'fav'
            ? CAT.filter(x => FAV.includes(x.id))
            : CAT.filter(x => !P.q || (x.n + ' ' + x.s + ' ' + x.g).toLowerCase().includes(P.q.toLowerCase()));

          body = (T0 == 'search'
            ? `<input id="q2" class="on" style="display:block;width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:10px;font:inherit;font-size:18px;margin-bottom:16px;user-select:text" placeholder="Search furniture, doors, lamps…" value="${P.q}">`
            : '')
            + (L.length
              ? `<div id="grid" class="${P.view}">${L.map(cardHTML).join('')}</div>`
              : `<p style="color:#4A6C99;font-size:18px">${T0 == 'fav' ? 'No favourites yet — tap the heart on an item.' : 'No results.'}</p>`);
        } else {
          const gs = GROUPS(T0);
          if (!gs[P.g]) P.g = Object.keys(gs)[0];
          if (!(P.s && gs[P.g] && gs[P.g].has(P.s))) P.s = [...gs[P.g]][0];

          if (P.lvl == 1 && Object.keys(gs).length > 1) {
            body = `<div id="grid">${Object.keys(gs).map(g =>
              `<div class="gt" data-g="${g}">${g}<small>${[...gs[g]].join(' · ')}</small></div>`
            ).join('')}</div>`;
          } else {
            const L = CAT.filter(x =>
              x.t == T0 && x.g == P.g && x.s == P.s &&
              (!P.q || x.n.toLowerCase().includes(P.q.toLowerCase()))
            );

            body = `
              <div id="cr">
                <button id="bk" title="Back">${ic('back')}</button>
                <span class="lk" id="gl">${P.g}</span>
                <span>/</span>
                <button id="sb" style="font-size:19px;display:flex;align-items:center;gap:4px">${P.s} ${ic('dn')}</button>
                <span class="sp"></span>
                <button class="fb" id="ft">${ic('filt')}Filter</button>
                <button class="vt ${P.view == 'grid' ? 'on' : ''}" data-v="grid">${ic('grid')}</button>
                <button class="vt ${P.view == 'list' ? 'on' : ''}" data-v="list">${ic('list')}</button>
                <div class="menu card" id="sm" style="top:40px;left:90px">${[...gs[P.g]].map(s =>
                  `<button class="${s == P.s ? 'on' : ''}" data-s="${s}">${s}</button>`
                ).join('')}</div>
              </div>
              <input id="q" class="${P.fq ? 'on' : ''}" placeholder="Filter by name…" value="${P.q}">
              <div id="grid" class="${P.view}">${L.map(cardHTML).join('')}</div>`;
          }
        }

        p.innerHTML = `
          <div id="ph">
            <h2>${TABS[T0]}</h2>
            <button id="xx" title="Expand">${ic('exp')}</button>
            <button id="xc" title="Close">${ic('x')}</button>
          </div>
          <div id="pb">${body}</div>`;

        shift();
        bindPanel();
      }

      function bindPanel() {
        const p = $('#panel');
        const $$ = s => p.querySelectorAll(s);

        $('#xc').onclick = () => { P.open = false; renderPanel(); };
        $('#xx').onclick = () => { P.xl = !P.xl; renderPanel(); };

        $$('input[data-k]').forEach(e => e.oninput = () => {
          S[e.dataset.k] = +e.value;
          e.nextElementSibling.textContent = fm(+e.value) + ' m';
          roomBuild();
          objs.forEach(refit);
          fit();
          p.querySelector('p b').textContent = 'Area: ' + fm(S.W * S.D) + ' m²';
        });
        $$('input[data-k]').forEach(e => e.onchange = () => push());

        $$('[data-f]').forEach(e => e.onclick = () => {
          S.floor = +e.dataset.f;
          roomBuild();
          push();
          renderPanel();
        });
        $$('[data-w]').forEach(e => e.onclick = () => {
          const c = WALLS[+e.dataset.w][1];
          if (selWall) S.walls[selWall] = c;
          else S.walls = { back: c, left: c, right: c };
          roomBuild();
          push();
        });

        $$('[data-g]').forEach(e => e.onclick = () => {
          P.g = e.dataset.g;
          P.s = null;
          P.lvl = 2;
          renderPanel();
        });

        const bk = $('#bk');
        if (bk) bk.onclick = () => { P.lvl = 1; renderPanel(); };

        const gl = $('#gl');
        if (gl) gl.onclick = () => { P.lvl = 1; renderPanel(); };

        const sb = $('#sb');
        if (sb) sb.onclick = ev => {
          ev.stopPropagation();
          $('#sm').classList.toggle('on');
        };

        $$('[data-s]').forEach(e => e.onclick = () => { P.s = e.dataset.s; renderPanel(); });
        $$('[data-v]').forEach(e => e.onclick = () => { P.view = e.dataset.v; renderPanel(); });

        const ft = $('#ft');
        if (ft) ft.onclick = () => {
          P.fq = !P.fq;
          renderPanel();
          if (P.fq) $('#q').focus();
        };

        const q = $('#q');
        if (q) q.oninput = () => {
          P.q = q.value;
          const pos = q.selectionStart;
          renderPanel();
          const n = $('#q');
          n.focus();
          n.setSelectionRange(pos, pos);
        };

        const q2 = $('#q2');
        if (q2) q2.oninput = () => {
          P.q = q2.value;
          const pos = q2.selectionStart;
          renderPanel();
          const n = $('#q2');
          n.focus();
          n.setSelectionRange(pos, pos);
        };

        $$('.it[data-i]').forEach(e => {
          const id = +e.dataset.i;

          e.querySelector('.pc').onclick = ev => {
            ev.stopPropagation();
            const d = CAT[id];
            const cur = ITC[id] || d.c;
            ITC[id] = PAL[(PAL.indexOf(cur) + 1) % PAL.length];
            e.querySelector('img').src = thumb(d, ITC[id]);
          };

          e.querySelector('.hr').onclick = ev => {
            ev.stopPropagation();
            FAV = FAV.includes(id) ? FAV.filter(x => x != id) : [...FAV, id];
            localStorage.setItem('fs-fav', JSON.stringify(FAV));
            ev.currentTarget.classList.toggle('on');
            ev.currentTarget.firstChild.style.fill = FAV.includes(id) ? 'currentColor' : 'none';
          };

          e.onclick = () => placeItem(id);
        });
      }

      function placeItem(id) {
        const d = CAT[id];
        const r = {
          id,
          x: 0,
          z: d.wall ? -S.D / 2 + .05 : .3,
          r: 0,
          c: ITC[id] || d.c
        };

        S.floors[S.fl].push(r);
        const o = mkObj(r);
        if (d.wall) moveTo(o, 0, -S.D / 2);
        select(o);
        push();
        toast(d.n + ' added — drag it to move');

        if (innerWidth < 900) {
          P.open = false;
          renderPanel();
        }
      }

      function resize() {
        const w = innerWidth;
        const h = innerHeight;
        R.setSize(w, h, false);
        cam.aspect = w / h;
        cam.updateProjectionMatrix();
        shift();
      }

      function shift() {
        const w = innerWidth;
        const h = innerHeight;
        const off = P.open && !P.xl && innerWidth > 900
          ? Math.min(740, w - 176) / 2 + 60
          : 0;
        cam.setViewOffset(w, h, -off, 0, w, h);
      }

      function fit() {
        dT = Math.max(S.W, S.D) * 2.5 + 4.5;
        tgt.set(0, S.H * .33, 0);
      }

      function camUpd() {
        if (mode == 'walk') {
          cam.position.set(walk.x, 1.6, walk.z);
          cam.lookAt(
            walk.x + Math.sin(walk.yaw) * Math.cos(walk.pit),
            1.6 + Math.sin(walk.pit),
            walk.z - Math.cos(walk.yaw) * Math.cos(walk.pit)
          );
          return;
        }
        cam.position.set(
          tgt.x + dist * Math.sin(az) * Math.cos(el),
          tgt.y + dist * Math.sin(el),
          tgt.z + dist * Math.cos(az) * Math.cos(el)
        );
        cam.lookAt(tgt);
      }

      const cv = R.domElement;
      let dn = null;

      function cast(e) {
        const b = cv.getBoundingClientRect();
        nd.set(
          (e.clientX - b.left) / b.width * 2 - 1,
          -((e.clientY - b.top) / b.height) * 2 + 1
        );
        ray.setFromCamera(nd, cam);
        return ray;
      }

      function pickItem(e) {
        const r = cast(e).intersectObjects([...objs, gz], true)[0];
        if (!r) return null;

        let o = r.object;
        while (o) {
          if (o === gz) return sel;
          if (o.userData.rec) return o;
          o = o.parent;
        }
        return null;
      }

      cv.onpointerdown = e => {
        cv.setPointerCapture(e.pointerId);

        if (mode == 'walk') {
          dn = { w: 1, x: e.clientX, y: e.clientY, yaw: walk.yaw, pit: walk.pit };
          return;
        }

        const dh = hitDim(e);
        if (dh) {
          const P0 = new T.Vector3();
          const hp = new T.Vector3();
          cast(e).ray.intersectPlane(pl, P0);
          dh.getWorldPosition(hp);
          dn = {
            dim: dh.userData.hid,
            off: dh.userData.hid == 'w' ? hp.x - P0.x : hp.z - P0.z,
            mv: 0
          };
          cv.style.cursor = 'grabbing';
          return;
        }

        const it = pickItem(e);
        if (it) {
          if (it !== sel) select(it);
          const P0 = new T.Vector3();
          cast(e).ray.intersectPlane(pl, P0);
          const r = it.userData.rec;
          dn = { it, ox: r.x - P0.x, oz: r.z - P0.z, mv: 0 };
          return;
        }

        const wr = cast(e).intersectObjects(room.children.filter(m => m.userData.wall), false)[0];
        dn = {
          o: 1,
          x: e.clientX,
          y: e.clientY,
          a: az,
          e: el,
          w: wr ? wr.object.userData.wall : null,
          mv: 0
        };
      };

      cv.onpointermove = e => {
        if (!dn) {
          cv.style.cursor = hitDim(e) ? 'pointer' : pickItem(e) ? 'move' : 'grab';
          return;
        }

        if (dn.dim) {
          const P1 = new T.Vector3();
          if (!cast(e).ray.intersectPlane(pl, P1)) return;

          const key = dn.dim == 'w' ? 'W' : 'D';
          let v = dn.dim == 'w' ? 2 * (P1.x + dn.off) : -2 * (P1.z + dn.off);
          v = clamp(Math.round(v / .5) * .5, 3, key == 'W' ? 10 : 12);
          if (v === S[key]) return;

          S[key] = v;
          dn.mv = 1;
          roomBuild();
          objs.forEach(refit);
          return;
        }

        if (dn.w && dn.yaw != null) {
          walk.yaw = dn.yaw + (e.clientX - dn.x) * .005;
          walk.pit = clamp(dn.pit - (e.clientY - dn.y) * .004, -1, 1);
          return;
        }

        if (dn.it) {
          const P1 = new T.Vector3();
          if (!cast(e).ray.intersectPlane(pl, P1)) return;
          dn.mv = 1;
          moveTo(dn.it, P1.x + dn.ox, P1.z + dn.oz);
          return;
        }

        if (dn.o) {
          if (Math.abs(e.clientX - dn.x) + Math.abs(e.clientY - dn.y) > 3) dn.mv = 1;
          az = dn.a - (e.clientX - dn.x) * .006;
          el = clamp(dn.e + (e.clientY - dn.y) * .005, .05, 1.52);
        }
      };

      cv.onpointerup = e => {
        if (dn) {
          if (dn.dim && dn.mv) {
            fit();
            push();
            if (P.open && P.tab == 'room') renderPanel();
          }
          if (dn.it && dn.mv) push();

          if (dn.o && !dn.mv) {
            if (dn.w) {
              selWall = selWall == dn.w ? null : dn.w;
            } else {
              selWall = null;
              select(null);
            }
            roomBuild();
          }
        }
        dn = null;
      };

      cv.onwheel = e => {
        e.preventDefault();
        dT = clamp(dT * (e.deltaY > 0 ? 1.08 : .92), 2, 40);
      };

      addEventListener('keydown', e => {
        if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
        keys[e.key.toLowerCase()] = 1;

        if ((e.key == 'Delete' || e.key == 'Backspace') && sel) del();
        if (e.key.toLowerCase() == 'r' && sel) rot();
        if ((e.ctrlKey || e.metaKey) && e.key == 'z') { e.preventDefault(); undo(); }
        if ((e.ctrlKey || e.metaKey) && e.key == 'y') { e.preventDefault(); redo(); }
      });
      addEventListener('keyup', e => delete keys[e.key.toLowerCase()]);

      function rot() {
        if (!sel) return;
        const r = sel.userData.rec;
        if (CAT[r.id].wall) return;
        r.r = (r.r + 90) % 360;
        apply(sel);
        push();
      }

      function del() {
        if (!sel) return;
        const r = sel.userData.rec;
        S.floors[S.fl] = S.floors[S.fl].filter(x => x !== r);
        sc.remove(sel);
        objs = objs.filter(o => o !== sel);
        select(null);
        push();
      }

      function undo() {
        if (hi > 0) {
          hi--;
          restore(hist[hi]);
        }
      }

      function redo() {
        if (hi < hist.length - 1) {
          hi++;
          restore(hist[hi]);
        }
      }

      $('#p1').onclick = rot;
      $('#p3').onclick = del;
      $('#p2').onclick = () => {
        if (!sel) return;
        const r = sel.userData.rec;
        r.c = PAL[(PAL.indexOf(r.c) + 1) % PAL.length];
        const i = objs.indexOf(sel);
        sc.remove(sel);
        objs.splice(i, 1);
        select(mkObj(r));
        push();
      };

      $('#undo').onclick = undo;
      $('#redo').onclick = redo;

      function floorMenu() {
        $('#gfm').innerHTML =
          S.names.map((n, i) => `<button data-i="${i}" class="${i == S.fl ? 'on' : ''}">${n}</button>`).join('')
          + (S.names.length < 4 ? '<button data-i="new">+ Add floor</button>' : '');
        $('#gfl').textContent = S.names[S.fl];
      }

      $('#np').onclick = e => {
        $('#npm').classList.toggle('on');
        $('#gfm').classList.remove('on');
      };

      $('#gf').onclick = e => {
        $('#gfm').classList.toggle('on');
        $('#npm').classList.remove('on');
      };

      document.addEventListener('click', e => {
        if (!e.target.closest('#np,#gf')) {
          document.querySelectorAll('#npm,#gfm').forEach(m => m.classList.remove('on'));
        }
        if (!e.target.closest('#cr')) {
          $('#sm') && $('#sm').classList.remove('on');
        }
      });

      $('#npm').onclick = e => {
        const a = e.target.dataset.a;

        if (a == 'new') {
          if (confirm('Start a new project? Unsaved changes will be lost.')) {
            S = fresh();
            hist = [];
            hi = -1;
            roomBuild();
            showFloor();
            select(objs[0]);
            fit();
            push();
            setUI();
          }
        } else if (a == 'open') {
          const j = localStorage.getItem('fs-editor');
          if (j) {
            S = JSON.parse(j);
            hist = [];
            hi = -1;
            roomBuild();
            showFloor();
            fit();
            push();
            setUI();
            toast('Project loaded');
          } else {
            toast('No saved project');
          }
        } else if (a == 'dl') {
          const b = new Blob([snap()], { type: 'application/json' });
          const l = document.createElement('a');
          l.href = URL.createObjectURL(b);
          l.download = 'freespace-project.json';
          l.click();
        }
      };

      $('#gfm').onclick = e => {
        const i = e.target.dataset.i;
        if (i == null) return;

        if (i == 'new') {
          S.floors.push([]);
          S.names.push(['Ground floor', '1st floor', '2nd floor', '3rd floor'][S.names.length] || 'Floor');
          S.fl = S.names.length - 1;
        } else {
          S.fl = +i;
        }

        showFloor();
        floorMenu();
        push();
      };

      $('#sv').onclick = () => {
        localStorage.setItem('fs-editor', snap());
        toast('Project saved');
      };

      $('#hp').onclick = () => {
        $('#hp .dot').remove();
        alert(
          'Tips\n' +
          '• Open Furniture and tap an item to add it to the room.\n' +
          '• Drag an item to move it; use the pencil to rotate, the pipette to change colour.\n' +
          '• Doors & windows snap to the walls.\n' +
          '• Drag empty space to orbit, scroll to zoom. Tap a wall to select it, then pick a colour in Surfaces.\n' +
          '• 2D = top view, walking figure = walk mode (WASD / arrows).\n' +
          '• Delete removes the selected item; Ctrl+Z / Ctrl+Y = undo / redo.'
        );
      };

      $('#rail').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        const t = b.dataset.t;

        if (t == 'shot') {
          R.render(sc, cam);
          const l = document.createElement('a');
          l.href = R.domElement.toDataURL('image/png');
          l.download = 'freespace-room.png';
          l.click();
          toast('Screenshot saved');
          return;
        }

        if (t == 'meas') {
          meas = !meas;
          dimUpd();
          renderPanel();
          return;
        }

        if (t == 'note') {
          const s = prompt('Note text');
          if (s) {
            addNote(s);
            toast('Note added');
          }
          return;
        }

        if (P.open && P.tab == t && t != 'furn') {
          P.open = false;
        } else {
          P.tab = t;
          P.open = true;
          P.lvl = t == 'furn' ? 2 : P.lvl;
        }
        renderPanel();
      };

      $('#cats').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        P.tab = b.dataset.t;
        P.lvl = 2;
        P.g = null;
        P.s = null;
        P.q = '';
        renderPanel();
      };

      const notes = [];

      function addNote(s) {
        const d = document.createElement('div');
        d.className = 'dm';
        d.style.background = '#111';
        d.textContent = s;
        d.style.display = 'block';
        d.style.pointerEvents = 'auto';
        d.ondblclick = () => d.remove();
        document.body.appendChild(d);

        notes.push({
          d,
          p: new T.Vector3((Math.random() - .5) * S.W * .6, S.H * .6, -S.D / 2 + .1)
        });
      }

      $('#bar').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;

        if (b.dataset.m) {
          setMode(b.dataset.m);
          return;
        }
        if (b.id == 'zo') dT = clamp(dT * 1.2, 2, 40);
        if (b.id == 'zi') dT = clamp(dT / 1.2, 2, 40);
        if (b.id == 'bs') $('#set').classList.toggle('on');
      };

      function setMode(m) {
        mode = m;
        document.querySelectorAll('#bar [data-m]').forEach(x =>
          x.classList.toggle('on', x.dataset.m == m)
        );

        if (m == '2d') {
          az = 0;
          el = 1.5;
        } else if (m == '3d') {
          az = .12;
          el = .62;
        } else {
          walk.x = 0;
          walk.z = S.D / 2 - .4;
          walk.yaw = 0;
          walk.pit = 0;
          P.open = false;
          selWall = null;
          renderPanel();
          select(null);
        }

        hs.visible = m != 'walk';
        roomBuild();
        dimVis();
      }

      $('#set').innerHTML = `
        <b style="font-size:18px">View settings</b>
        <label><input type="checkbox" id="sw1"> Opaque walls</label>
        <label><input type="checkbox" id="sw2"> Show dimensions</label>`;

      $('#sw1').onchange = e => {
        S.opaque = e.target.checked;
        roomBuild();
      };

      $('#sw2').checked = true;
      $('#sw2').onchange = e => {
        meas = e.target.checked;
        dimUpd();
        renderPanel();
      };

      const proj = (v) => {
        const p = v.clone().project(cam);
        return [(p.x + 1) / 2 * innerWidth, (1 - p.y) / 2 * innerHeight, p.z < 1];
      };

      function dimUpd() {
        dimVis();
      }

      function overlay() {
        notes.forEach(n => {
          const p = proj(n.p);
          n.d.style.left = p[0] + 'px';
          n.d.style.top = p[1] + 'px';
        });

        const pop = $('#pop');
        const dragging = dn && ((dn.it && dn.mv) || dn.dim);

        if (sel && mode != 'walk' && !dragging) {
          const b = new T.Box3().setFromObject(sel);
          const c = b.getCenter(new T.Vector3());
          c.y = b.max.y;
          const p = proj(c);
          pop.classList.add('on');
          pop.style.left = p[0] + 'px';
          pop.style.top = p[1] + 'px';
        } else {
          pop.classList.remove('on');
        }
      }

      function setUI() {
        floorMenu();
        renderPanel();
      }

      let last = performance.now();

      function loop(t) {
        requestAnimationFrame(loop);
        const dt = Math.min(.05, (t - last) / 1000);
        last = t;

        if (mode == 'walk') {
          const sp = 2 * dt;
          const fx = Math.sin(walk.yaw);
          const fz = -Math.cos(walk.yaw);
          let mx = 0, mz = 0;

          if (keys.w || keys.arrowup) { mx += fx; mz += fz; }
          if (keys.s || keys.arrowdown) { mx -= fx; mz -= fz; }
          if (keys.a || keys.arrowleft) { mx += fz; mz -= fx; }
          if (keys.d || keys.arrowright) { mx -= fz; mz += fx; }

          walk.x = clamp(walk.x + mx * sp, -S.W / 2 + .3, S.W / 2 - .3);
          walk.z = clamp(walk.z + mz * sp, -S.D / 2 + .3, S.D / 2 - .3);
        }

        dist += (dT - dist) * Math.min(1, dt * 8);
        camUpd();

        if (sel) {
          gz.position.set(sel.position.x, .03, sel.position.z);
          if (bh) bh.box.setFromObject(sel);
        }

        R.render(sc, cam);
        overlay();
      }

      const sv = localStorage.getItem('fs-editor-auto');
      S = fresh();
      addEventListener('resize', resize);

      roomBuild();
